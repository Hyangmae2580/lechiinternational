<section class="inquiry-section">


    <div class="inquiry-container">


        <div class="inquiry-title">

            <span>INQUIRY</span>

            <h1>견적 및 제품 문의</h1>

            <p>
                제품 및 견적에 관한 문의사항을 남겨주시면
                확인 후 연락드리겠습니다.
            </p>

        </div>



        <!-- 견적문의 폼 -->

        <form
            id="quoteForm"
            class="inquiry-form"
        >


            <!-- 문의 유형 -->

            <div class="form-group">

                <label>
                    문의 유형 <em>*</em>
                </label>

                <select
                    name="inquiry_type"
                    required
                >

                    <option value="">
                        문의 유형을 선택해주세요
                    </option>

                    <option value="제품 견적">
                        제품 견적
                    </option>

                    <option value="제품 문의">
                        제품 문의
                    </option>

                    <option value="주문제작">
                        주문제작
                    </option>

                    <option value="납품 문의">
                        납품 문의
                    </option>

                    <option value="기타">
                        기타
                    </option>

                </select>

            </div>



            <!-- 제품명 -->

            <div class="form-group">

                <label>
                    제품명 <em>*</em>
                </label>

                <input
                    type="text"
                    name="product"
                    placeholder="문의하실 제품명을 입력해주세요."
                    required
                >

            </div>



            <!-- 문의 내용 -->

            <div class="form-group">

                <label>
                    문의내용 <em>*</em>
                </label>

                <textarea
                    name="message"
                    rows="7"
                    placeholder="필요한 제품의 규격, 수량, 납기일 등 문의사항을 입력해주세요."
                    required
                ></textarea>

            </div>



            <!-- 성명 -->

            <div class="form-group">

                <label>
                    문의자 성명 <em>*</em>
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="성명을 입력해주세요."
                    required
                >

            </div>



            <!-- 회사명 -->

            <div class="form-group">

                <label>
                    회사명
                </label>

                <input
                    type="text"
                    name="company"
                    placeholder="회사명을 입력해주세요."
                >

            </div>



            <!-- 연락처 -->

            <div class="form-group">

                <label>
                    문의자 연락처 <em>*</em>
                </label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="010-0000-0000"
                    required
                >

            </div>



            <!-- 이메일 -->

            <div class="form-group">

                <label>
                    이메일 <em>*</em>
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >

            </div>



            <!-- 사업자번호 -->

            <div class="form-group">

                <label>
                    사업자등록번호
                </label>

                <input
                    type="text"
                    name="business_number"
                    placeholder="000-00-00000"
                >

            </div>



            <!-- 첨부파일 -->

            <div class="form-group">

                <label>
                    첨부파일
                </label>

                <input
                    type="file"
                    name="attachment"
                >

                <small>
                    제품 사진, 도면, 견적 요청서 등을 첨부할 수 있습니다.
                </small>

            </div>



            <!-- 개인정보 -->

            <div class="privacy-box">

                <label>

                    <input
                        type="checkbox"
                        name="privacy_agree"
                        value="동의"
                        required
                    >

                    개인정보 수집 및 이용에 동의합니다.

                </label>

            </div>



            <!-- 전송 -->

            <button
                type="submit"
                class="inquiry-submit"
            >
                문의 보내기
            </button>


        </form>


        <!-- 홈페이지로 돌아가기 -->

        <div class="bracket-home">

            <a href="index.html">
                ← 홈페이지로 돌아가기
            </a>

        </div>


    </div>

</section>

<!-- EmailJS -->
<!-- ========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    // EmailJS 초기화
    emailjs.init({
        publicKey: "MjniVxM5ti6CLkizJ"
    });


    // 문의 폼 찾기
    const quoteForm = document.getElementById("quoteForm");


    // 폼이 없으면 종료
    if (!quoteForm) {

        console.error("quoteForm을 찾을 수 없습니다.");

        return;

    }


    // 문의 보내기
    quoteForm.addEventListener("submit", function (event) {

        event.preventDefault();


        // 버튼
        const submitButton =
            quoteForm.querySelector(".inquiry-submit");


        // 전송 중 표시
        if (submitButton) {

            submitButton.disabled = true;

            submitButton.textContent = "전송 중...";

        }


        // EmailJS 전송
        emailjs.sendForm(
            "service_hcx2ib7",
            "template_z098a1s",
            quoteForm
        )

        .then(function (response) {

            console.log(
                "EmailJS 전송 성공:",
                response
            );


            alert(
                "견적문의가 정상적으로 접수되었습니다."
            );


            // 입력 내용 초기화
            quoteForm.reset();

        })


        .catch(function (error) {

            console.error(
                "EmailJS 전송 오류:",
                error
            );


            alert(
                "문의 전송에 실패했습니다.\n\n" +
                "오류 내용을 확인해주세요."
            );

        })


        .finally(function () {

            // 버튼 원상복구
            if (submitButton) {

                submitButton.disabled = false;

                submitButton.textContent = "문의 보내기";

            }

        });

    });

});

</script>


</body>

</html>
